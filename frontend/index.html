<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reclass JE Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="header__title">FA Gain/Loss Reclass</h1>
      <p class="header__subtitle">Journal Entry Generator</p>
    </header>

    <main class="card">
      <div class="form-group">
        <label class="label" for="inputFolder">
          Input Folder Path
          <span class="label__hint">Folder containing the Excel workbook</span>
        </label>
        <input
          id="inputFolder"
          class="input"
          type="text"
          placeholder="e.g.  C:\Users\tanap\mew-reclass\input"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <div class="form-group">
        <label class="label" for="outputFolder">
          Output Folder Path
          <span class="label__hint">Where the JE Excel file will be saved</span>
        </label>
        <input
          id="outputFolder"
          class="input"
          type="text"
          placeholder="e.g.  C:\Users\tanap\mew-reclass\output"
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <button id="runBtn" class="btn btn--primary" type="button">
        <span class="btn__icon">&#9654;</span> Run
      </button>

      <div id="statusBox" class="status status--hidden" aria-live="polite"></div>
    </main>

    <footer class="footer">POC v1.0 — Functional Areas F620 &amp; F630</footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
